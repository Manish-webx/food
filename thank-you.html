<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Nere</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="Foodily Logo" class="logo-img">
            </a>
        </div>
        <button class="mobile-menu-btn"
            onclick="document.querySelector('.nav-links').classList.toggle('active'); this.classList.toggle('open');">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links">
            <a href="index.html#menu"
                onclick="document.querySelector('.nav-links').classList.remove('active'); document.querySelector('.mobile-menu-btn').classList.remove('open');">Menu</a>
            <a href="index.html#events"
                onclick="document.querySelector('.nav-links').classList.remove('active'); document.querySelector('.mobile-menu-btn').classList.remove('open');">Events</a>
            <a href="index.html#blog"
                onclick="document.querySelector('.nav-links').classList.remove('active'); document.querySelector('.mobile-menu-btn').classList.remove('open');">Blog</a>
            <a href="index.html#about"
                onclick="document.querySelector('.nav-links').classList.remove('active'); document.querySelector('.mobile-menu-btn').classList.remove('open');">About</a>
            <a href="index.html#contact" class="mobile-contact-link"
                onclick="document.querySelector('.nav-links').classList.remove('active'); document.querySelector('.mobile-menu-btn').classList.remove('open');">Contact
                Us</a>
        </nav>
        <a href="index.html#contact" class="nav-contact-btn" style="text-decoration: none;">Contact Us</a>
    </header>

    <main style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 120px 20px 60px 20px; background-color: #fbfbfb;">
        <div style="text-align: center; max-width: 600px;">
            <div style="font-size: 4rem; color: #b7b89d; margin-bottom: 1rem;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 style="font-family: 'Caveat', cursive; font-size: 4.5rem; color: #023118; margin-bottom: 1rem;">Thank You!</h1>
            <p style="font-family: 'Poppins', sans-serif; font-size: 1.2rem; color: #333; margin-bottom: 2.5rem;">We have received your message and will get back to you shortly.</p>
            <a href="index.html" class="buy-now-btn" style="text-decoration: none; padding: 1rem 2.5rem; display: inline-flex; justify-content: center; border-radius: 50px;">
                Back to Home
            </a>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="site-footer">
        <div class="footer-ragged-edge">
            <svg width="0" height="0">
                <filter id="footer-ragged">
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R"
                        yChannelSelector="G" />
                </filter>
            </svg>
            <div class="footer-ragged-shape"></div>
        </div>

        <div class="footer-bg">
            <i class="fas fa-leaf footer-leaf-1"></i>
            <i class="fas fa-lemon footer-lemon-1"></i>
            <i class="fas fa-seedling footer-seedling-1"></i>
            <i class="fas fa-apple-whole footer-apple-1"></i>
        </div>

        <div class="footer-container">
            <div class="footer-grid"
                style="grid-template-columns: 1fr 1fr; max-width: 800px; margin: 0 auto; text-align: center; gap: 4rem;">
                <div class="footer-col">
                    <h2 class="footer-heading"
                        style="font-family: 'Caveat', cursive; font-size: 4.5rem; color: #ffffff; margin-bottom: 0.5rem;">
                        Nere</h2>
                    <p class="footer-text" style="font-size: 1.2rem; margin-bottom: 0.5rem;">Hydration made simple.</p>
                    <p class="footer-text" style="font-size: 1.2rem; font-weight: 600; color: #b7b89d;">Hydrating Delhi
                        NCR</p>
                </div>

                <div class="footer-col"
                    style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    <div style="display: flex; flex-direction: column; align-items: flex-start;">
                        <div class="footer-contact-item"
                            style="display: flex; align-items: center; font-size: 1.1rem; margin-bottom: 1.5rem;">
                            <i class="fab fa-instagram"
                                style="color: #b7b89d; font-size: 1.5rem; margin-right: 10px; width: 24px; text-align: center;"></i>
                            <a href="https://www.instagram.com/drink.nere_/"
                                style="color: #e0e0e0; text-decoration: none;">drink.nere_</a>
                        </div>
                        <div class="footer-contact-item" style="display: flex; align-items: center; font-size: 1.1rem;">
                            <i class="far fa-envelope"
                                style="color: #b7b89d; font-size: 1.5rem; margin-right: 10px; width: 24px; text-align: center;"></i>
                            <a href="mailto:vestafoodsandbeverages@gmail.com"
                                style="color: #e0e0e0; text-decoration: none;">vestafoodsandbeverages@gmail.com</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer-bottom">
                <p>&copy; 2026 Nere All Rights Reserved.</p>
            </div>
        </div>
    </footer>
</body>

</html>
